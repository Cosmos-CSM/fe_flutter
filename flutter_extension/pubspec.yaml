name: flutter_extension
description: A framework extension, provides utilities, tools and common shared view for CSM development.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.3.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter  
  flutter_localizations:
    sdk: flutter

  # Third Party 
  device_info_plus: ^12.2.0
  go_router: ^17.0.0
  get_it: ^9.0.5
  intl: ^0.20.2

  # Internal 
  csm_client_core: 
    git:
      path: csm_client_core/
      url: https://github.com/Cosmos-CSM/csm_client
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  lints: ^6.0.0
    

flutter:
  assets: 
    - 'assets/'
    - 'assets/business/'